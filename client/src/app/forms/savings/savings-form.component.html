<app-main-layout screenMode="full">
  <span ngProjectAs="header-content">
    {{ !selectedSaving ? "Add Saving" : "Edit Saving" }}
  </span>

  <div ngProjectAs="bottom-content" class="flex flex-col items-center">
    <form
      [formGroup]="savingsForm"
      (ngSubmit)="onSubmit()"
      id="savingsForm"
      class="w-72 mt-8 mb-4"
    >
      <div class="flex flex-col text-left mb-4">
        <label
          for="category"
          class="text-light-green text-sm font-league-spartan translate-x-3 mb-1"
          [class.text-red-400]="isCategoryRequired"
        >
          <span>Category</span>

          @if (isCategoryRequired) {
            <span> - field required </span>
          }
        </label>

        <div
          id="category"
          class="rounded-full bg-light-green p-1 px-6 text-main-layout z-10"
          form="savingsForm"
          (click)="toggleCategoryDropdown.set(!toggleCategoryDropdown())"
          (mouseleave)="toggleCategoryDropdown.set(false)"
        >
          @if (!categoryFormValue) {
            <span class="opacity-50">Select Category</span>
          } @else {
            <span>
              {{ categoryFormValue }}
            </span>
          }
        </div>

        @if (toggleCategoryDropdown()) {
          <div
            class="bg-light-green flex flex-col rounded-t-2xl rounded-b-2xl -translate-y-7"
          >
            <ul class="py-2 text-sm text-main-layout px-6 mt-4">
              @for (category of categories; track category.id) {
                @if (category.name !== "Salary") {
                  <li (click)="setCategory(category.name)">
                    <p class="text-lg py-1" form="savingsForm">
                      {{ category.name }}
                    </p>
                  </li>
                }
              }
            </ul>
          </div>
        }
      </div>

      <div class="flex flex-col text-left mb-4">
        <label
          for="goalAmount"
          class="text-light-green text-sm font-league-spartan translate-x-3 mb-1"
          [class.text-red-400]="isGoalAmountRequired"
        >
          <span>Goal Amount</span>

          @if (isGoalAmountRequired) {
            <span> - field required </span>
          }
        </label>
        <input
          id="goalAmount"
          type="text"
          formControlName="goalAmount"
          class="rounded-full bg-light-green outline-none p-1 px-6 text-main-layout"
          placeholder="€10.00"
          (mouseleave)="formatGoalAmountOnLeave()"
          (mouseenter)="formatGoalAmountOnEnter()"
        />
      </div>

      <div class="flex flex-col text-left mb-4">
        <label
          for="savingtitle"
          class="text-light-green text-sm font-league-spartan translate-x-3 mb-1"
          [class.text-red-400]="savingTitleLengthExceeded"
        >
          <span>Saving Title</span>

          @if (savingTitleLengthExceeded) {
            <span class="translate-x-3 mb-1 text-sm">
              - max length of 50 characters exceeded
            </span>
          }
        </label>
        <input
          id="savingtitle"
          type="text"
          formControlName="savingTitle"
          class="rounded-full bg-light-green outline-none p-1 px-6 text-main-layout"
          placeholder="Lunch"
        />
      </div>

      <div class="flex flex-col text-left mb-4">
        <label
          for="description"
          class="text-light-green text-sm font-league-spartan translate-x-3 mb-1"
          [class.text-red-400]="descriptionMaxLengthExceeded"
        >
          <span>Description</span>
          @if (descriptionMaxLengthExceeded) {
            <span class="translate-x-3 mb-1 text-sm">
              - max length of 50 characters exceeded
            </span>
          }
        </label>

        <textarea
          id="description"
          class="rounded-xl bg-light-green outline-none px-6 py-3 p-1 text-main-layout h-24 leading-3 resize-none"
          placeholder="..."
          formControlName="description"
        >
        </textarea>
      </div>
    </form>

    <app-custom-btn
      form="savingsForm"
      type="submit"
      width="half"
      text="Save"
      [loading]="loading()"
    />
  </div>
</app-main-layout>
