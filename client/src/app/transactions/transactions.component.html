<app-main-layout>
  <span ngProjectAs="header-content">Transactions</span>

  <div ngProjectAs="top-content" class="mt-3">
    <div
      class="flex flex-col text-base bg-honeydew text-main-layout mx-8 p-1 rounded-xl"
    >
      <span class="font-medium">Total balance</span>
      <span class="text-2xl font-extrabold">{{
        transactionsTotals().totalBalance | currency: "EUR" : "symbol" : "1.0-2"
      }}</span>
    </div>

    <div class="flex items-center justify-between mx-8 mt-3 gap-2.5">
      <div
        class="flex flex-col items-center bg-honeydew p-3 rounded-xl w-full"
        [class.text-main-layout]="!isIncomeSelected()"
        [class.bg-ocean-blue]="isIncomeSelected()"
        [class.text-honeydew]="isIncomeSelected()"
        (click)="showIncomesOnly()"
      >
        <app-income-counter
          [totalIncome]="transactionsTotals().totalIncome"
          [isSelected]="isIncomeSelected()"
        />
      </div>

      <div
        class="flex flex-col items-center bg-honeydew p-3 rounded-xl w-full"
        [class.text-main-layout]="!isExpensesSelected()"
        [class.bg-ocean-blue]="isExpensesSelected()"
        [class.text-honeydew]="isExpensesSelected()"
        (click)="showExpensesOnly()"
      >
        <app-expenses-counter
          [totalExpenses]="transactionsTotals().totalExpenses"
          [isSelected]="isExpensesSelected()"
        />
      </div>
    </div>
  </div>

  <div
    ngProjectAs="bottom-content"
    [class.mb-24]="transactions().length"
    [class.mt-2]="transactions().length"
    class="mx-6 w-80 overflow-x-hidden max-h-screen"
    (scroll)="onScroll($event)"
  >
    <app-svg-plus
      (click)="routerService.navigateToTransactionsAdd()"
      class="fixed right-0 -translate-x-9 -translate-y-0"
    />

    <app-transactions-list />
  </div>
</app-main-layout>
