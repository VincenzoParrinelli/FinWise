<div
  class="flex flex-col justify-between items-center w-24 mx-3"
  [class.-translate-y-2]="randomSaving()"
>
  @if (randomSaving()) {
    <svg width="100" height="90" viewbox="0 0 100 80">
      <circle
        cx="50"
        cy="50"
        r="30"
        fill="none"
        stroke="#eee"
        stroke-width="3"
      ></circle>

      <circle
        cx="50"
        cy="50"
        r="30"
        fill="none"
        stroke="#0068FF"
        stroke-width="3"
        [attr.stroke-dasharray]="strokeDasharray"
        [attr.stroke-dashoffset]="strokeDashoffset"
        stroke-linecap="round"
        transform="rotate(-90 50 50)"
      ></circle>
    </svg>

    @for (category of categories; track $index) {
      @if (randomSaving()!.category === category.name) {
        <div class="absolute translate-y-7">
          <ng-container
            *ngComponentOutlet="
              category.svgComponent;
              injector: injectSvgProps()
            "
          >
          </ng-container>
        </div>
      }
    }
  } @else {
    <span class="text-sm leading-4">No saving found</span>
  }

  @if (randomSaving()) {
    <span class="text-sm font-semibold leading-4">
      Saving On <br />{{ randomSaving()!.savingTitle }}
    </span>
  }
</div>
