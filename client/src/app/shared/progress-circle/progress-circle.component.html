<div
  class="flex flex-col justify-between items-center w-24 mx-3"
  [class.-translate-y-2]="randomSaving()"
>
  <svg width="100" height="90" viewbox="0 0 100 80">
    <circle
      cx="50"
      cy="50"
      [attr.r]="radius()"
      fill="none"
      stroke="#eee"
      stroke-width="3"
    ></circle>

    <circle
      cx="50"
      cy="50"
      [attr.r]="radius()"
      fill="none"
      stroke="#0068FF"
      stroke-width="3"
      [attr.stroke-dasharray]="strokeDasharray"
      [attr.stroke-dashoffset]="strokeDashoffset"
      stroke-linecap="round"
      transform="rotate(-90 50 50)"
    ></circle>
  </svg>

  @for (category of categories; track $index) {
    @if (randomSaving()!.category === category.name) {
      <div class="absolute flex translate-y-7">
        @if (!showPercentage()) {
          <ng-container
            *ngComponentOutlet="
              category.svgComponent;
              injector: injectSvgProps()
            "
          >
          </ng-container>
        } @else {
          <span class="translate-y-3 font-semibold"
            >{{ progressPercentage }}%</span
          >
        }
      </div>
    }
  }
</div>
