<div class="flex flex-col items-center">
  <app-svg-expenses [stroke]="expensesStrokeColor" [fill]="expensesFillColor" />
  <p class="text-sm font-medium leading-4">Expense</p>
  <p
    class="text-lg font-bold leading-5"
    [class.text-vivid-blue]="!isSelected()"
  >
    {{ totalExpenses() | currency: "EUR" : "symbol" : "1.0-2" }}
  </p>
</div>
