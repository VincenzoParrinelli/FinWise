<app-main-layout screenMode="full">
  <span ngProjectAs="header-content">
    {{ transaction()?.transactionTitle || transaction()?.category }}
  </span>

  <div ngProjectAs="bottom-content" class="w-full h-full my-8">
    <div class="flex justify-between items-center mx-14">
      <div class="flex flex-col">
        <label class="text-sm font-thin">Amount</label>
        <span
          class="text-2xl font-bold"
          [class.text-vivid-blue]="transaction()?.amount! < 0"
          >{{ transaction()?.amount | currency }}</span
        >
      </div>

      @for (category of categories; track $index) {
        @if (transaction()?.category === category.name) {
          <ng-container
            *ngComponentOutlet="
              category.svgComponent;
              injector: injectSvgProps()
            "
          >
          </ng-container>
        }
      }
    </div>

    <div class="flex flex-col mt-10 text-left">
      <span class="text-2xl font-semibold ml-6">Description: </span>
      <p class="mt-6 mx-6">
        {{ transaction()?.description || "No description" }}
      </p>
    </div>
  </div>
</app-main-layout>
